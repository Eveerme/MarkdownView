appId: com.markdownview.desktop
productName: markdownview
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
