appId: com.markdownview.desktop
productName: MarkdownView
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
fileAssociations:
  - ext:
      - md
      - markdown
    name: MarkdownView.Document
    description: Markdown 文档
    mimeType: text/markdown
    role: Editor
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MarkdownView
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
